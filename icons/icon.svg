<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Kitbash</title>

  <!-- Glyph 4a, split play, from the Workbench design project. A play triangle
       cut into three slabs. Path data is the authored 48 by 48 art, placed by a
       transform rather than rescaled by hand so it can be diffed against the
       source. The mark sits right of centre in its own view box, which is the
       optical correction a triangle needs. Do not centre it. -->
  <defs>
    <linearGradient id="tile" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1b2f42"/>
      <stop offset="1" stop-color="#0a1119"/>
    </linearGradient>
    <linearGradient id="rim" x1="128" y1="0" x2="128" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="4.5" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#tile)"/>

  <!-- The filter sits on the outer group so its offset and blur stay in 256
       units. Moving it onto the scaled group multiplies both by 4.2. -->
  <g filter="url(#drop)">
    <g transform="translate(27.2 27.2) scale(4.2)">
      <path d="M13 8h1.5L30 17.5 13 17.5z" fill="#cfe0f2"/>
      <path d="M13 20h20.5L41 24l-7.5 4H13z" fill="#4d8fd6"/>
      <path d="M13 30.5h17L14.5 40H13z" fill="#8fa4b8"/>
    </g>
  </g>

  <rect x="1" y="1" width="254" height="254" rx="51" fill="none" stroke="url(#rim)" stroke-width="2"/>
</svg>
